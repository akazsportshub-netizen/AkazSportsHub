# AKAZ Sports Hub API — NGINX reverse proxy, TLS termination and rate limiting.
#
# This file belongs in /etc/nginx/conf.d/ on the production host, where it is
# included inside nginx.conf's `http` block (so the `map`, `upstream` and
# `limit_req_zone` directives below are in the context they require).
#
#   1. Replace api.akazsportshub.com with the real hostname.
#   2. Get a certificate:  certbot certonly --webroot -w /var/www/certbot -d api.akazsportshub.com
#   3. nginx -t && systemctl reload nginx
#
# The API itself is published by docker-compose on 127.0.0.1:3000 only, so it is
# reachable through this proxy and nowhere else.

upstream akaz_api {
    # If NGINX runs as a container in the same compose project, use `api:3000`.
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# WebSocket upgrade. Live match timers will use this; plain requests must not be
# sent an Upgrade header.
#
# The empty case maps to an empty value, not to "close": nginx omits a header
# whose value is empty, which is what lets the `keepalive 32` above actually
# reuse upstream connections. Sending `Connection: close` on every ordinary
# request — as most copied-around snippets do — quietly disables it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Rate limiting, keyed on the client address. $binary_remote_addr is the real
# client because this proxy is the only hop that sets X-Forwarded-For.
#   api      — ordinary traffic, generous enough for app screens that fan out.
#   writes   — booking, payment and match-sync endpoints.
#   webhook  — payment providers. Kept separate and roomy: dropping a provider
#              callback costs money, and providers burst on retry.
limit_req_zone $binary_remote_addr zone=akaz_api:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=akaz_writes:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=akaz_webhook:5m rate=50r/s;
limit_req_status 429;

# ---- :80 — ACME challenge and redirect to TLS --------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name api.akazsportshub.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- :443 — the API ----------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    # `http2 on` needs nginx 1.25.1 or newer. On an older build, delete this line
    # and write `listen 443 ssl http2;` above instead.
    http2       on;
    server_name api.akazsportshub.com;

    ssl_certificate     /etc/letsencrypt/live/api.akazsportshub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.akazsportshub.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:AkazTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling is deliberately not enabled: Let's Encrypt has retired its
    # OCSP responders, so `ssl_stapling on` only fills the error log with
    # "issuer certificate not found" warnings.

    # Security headers. This host serves JSON to the mobile app and to payment
    # providers, so a CSP that forbids everything is both correct and harmless.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'" always;

    server_tokens off;
    client_max_body_size 2m;          # the largest real request is a 200-event referee batch
    client_body_timeout  30s;

    gzip             on;
    gzip_types       application/json;
    gzip_min_length  1024;
    gzip_proxied     any;

    access_log /var/log/nginx/akaz-api.access.log;
    error_log  /var/log/nginx/akaz-api.error.log warn;

    # Shared proxy settings for every location below.
    # X-Forwarded-* are what the API reads for the client address; it is started
    # with `trust proxy 1`, which assumes exactly this one hop.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_redirect off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_next_upstream   error timeout http_502 http_503 http_504;

    # Payment provider callbacks.
    #
    # Webhook signatures are HMACs over the exact request bytes, so nothing here
    # may alter the body: no sub_filter, no charset rewriting, and buffering is
    # left on only because it passes the body through byte for byte.
    #
    # A provider that gets a 5xx retries, so failing fast is better than queuing:
    # one proxy attempt, no retry on error, and `nodelay` so a retry burst is
    # served rather than spread out.
    location ~ ^/v1/webhooks/(tap|checkout)$ {
        limit_req zone=akaz_webhook burst=100 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://akaz_api;
        proxy_next_upstream off;
        proxy_read_timeout  30s;
        access_log /var/log/nginx/akaz-webhooks.access.log;
    }

    # Writes: holds, payments, cancellations, referee sync, ringer responses.
    location ~ ^/v1/(bookings|matches|ringer-invites) {
        limit_req zone=akaz_writes burst=20 nodelay;
        proxy_pass http://akaz_api;
    }

    # Live match timers over WebSocket (not implemented yet; the route is ready).
    #
    # `^~` is load-bearing. A regex location beats a plain prefix location even
    # when the prefix is longer, so without it the `^/v1/(bookings|matches|…)`
    # block above would capture this path and the long timeouts below would
    # never apply. `^~` tells nginx to stop once this prefix is the best match
    # and skip regex matching altogether.
    location ^~ /v1/matches/live {
        proxy_pass http://akaz_api;
        proxy_read_timeout 1h;        # a timer connection is idle between events
        proxy_send_timeout 1h;
        proxy_buffering    off;
    }

    # Health. Reachable from the deploy script and uptime checks; it reports only
    # whether Postgres and Redis answer, and carries no data.
    location = /v1/health {
        limit_req zone=akaz_api burst=20 nodelay;
        access_log off;
        proxy_pass http://akaz_api;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    # Everything else under /v1 — venue discovery, reads.
    location /v1/ {
        limit_req zone=akaz_api burst=40 nodelay;
        proxy_pass http://akaz_api;
    }

    # Nothing is served outside /v1.
    location / {
        return 404 '{"code":"NOT_FOUND","message":"No such route"}';
        default_type application/json;
    }
}
